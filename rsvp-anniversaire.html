<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSVP - Anniversaire Alexia & Tristan</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
            padding: 40px;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 28px;
            color: #333;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 16px;
            color: #666;
            line-height: 1.5;
        }

        .emoji {
            font-size: 50px;
            margin-bottom: 15px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
            font-size: 16px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .radio-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .radio-option {
            display: flex;
            align-items: center;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .radio-option:hover {
            border-color: #667eea;
            background-color: #f8f9ff;
        }

        .radio-option input[type="radio"] {
            margin-right: 12px;
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: #667eea;
        }

        .radio-option label {
            margin: 0;
            font-weight: 500;
            cursor: pointer;
            flex: 1;
        }

        .radio-option input[type="radio"]:checked + label {
            font-weight: 600;
            color: #667eea;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            margin-top: 10px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .success-message {
            display: none;
            text-align: center;
            padding: 20px;
            background-color: #e8f5e9;
            border-radius: 10px;
            color: #2e7d32;
            margin-top: 20px;
        }

        .error-message {
            display: none;
            text-align: center;
            padding: 20px;
            background-color: #ffebee;
            border-radius: 10px;
            color: #c62828;
            margin-top: 20px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 30px 20px;
            }

            .header h1 {
                font-size: 24px;
            }

            .emoji {
                font-size: 40px;
            }

            .radio-option {
                padding: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="emoji">🎉</div>
            <h1>Anniversaire Alexia & Tristan</h1>
            <p>Samedi 15 septembre à partir de 20h</p>
        </div>

        <form id="rsvpForm" action="/.netlify/functions/rsvp>
            <div class="form-group">
                <label for="prenomInput">Ton prénom</label>
                <input 
                    type="text" 
                    id="prenomInput" 
                    name="prénom" 
                    placeholder="Jean" 
                    required
                    readonly
                    style="background-color: #f5f5f5;"
                >
            </div>

            <div class="form-group">
                <label>Tu viens ? *</label>
                <div class="radio-group">
                    <div class="radio-option">
                        <input 
                            type="radio" 
                            id="oui" 
                            name="réponse" 
                            value="Oui, je viens ! 🎉" 
                            required
                        >
                        <label for="oui">Oui, je viens ! 🎉</label>
                    </div>

                    <div class="radio-option">
                        <input 
                            type="radio" 
                            id="peutetre" 
                            name="réponse" 
                            value="Peut-être, je te dis bientôt 🤔"
                        >
                        <label for="peutetre">Peut-être, je te dis bientôt 🤔</label>
                    </div>

                    <div class="radio-option">
                        <input 
                            type="radio" 
                            id="non" 
                            name="réponse" 
                            value="Non, pas possible cette fois 😞"
                        >
                        <label for="non">Non, pas possible cette fois 😞</label>
                    </div>
                </div>
            </div>

            <!-- Champs cachés pour le tracking -->
            <input type="hidden" name="timestamp" id="timestamp">
            <input type="hidden" name="user_link" id="userLink">

            <button type="submit" class="submit-btn">Confirmer ma réponse</button>
        </form>

        <div class="success-message" id="successMessage">
            ✅ Merci ! Ta réponse a bien été enregistrée.
        </div>
        <div class="error-message" id="errorMessage">
            ❌ Erreur lors de l'envoi. Réessaie stp.
        </div>
    </div>

    <script>
        // Récupère le prénom de l'URL
        const params = new URLSearchParams(window.location.search);
        const prenom = params.get('name');

        if (prenom) {
            document.getElementById('prenomInput').value = prenom;
        } else {
            // Si pas de prénom dans l'URL, laisse l'utilisateur le rentrer
            document.getElementById('prenomInput').removeAttribute('readonly');
            document.getElementById('prenomInput').style.backgroundColor = 'white';
        }

        // Ajoute le timestamp et le lien de l'utilisateur
        document.getElementById('timestamp').value = new Date().toISOString();
        document.getElementById('userLink').value = window.location.href;

        // Gère l'envoi du formulaire
        document.getElementById('rsvpForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const formData = new FormData(this);
            const prenom = document.getElementById('prenomInput').value;
            const reponse = document.querySelector('input[name="réponse"]:checked')?.value || '';

            if (!prenom || !reponse) {
                document.getElementById('errorMessage').textContent = '❌ Veuillez remplir tous les champs.';
                document.getElementById('errorMessage').style.display = 'block';
                return;
            }

            // Envoie les données
            fetch(this.action, {
                method: 'POST',
                body: formData,
                headers: {
                    'Accept': 'application/json'
                }
            })
            .then(response => {
                if (response.ok) {
                    document.getElementById('rsvpForm').style.display = 'none';
                    document.getElementById('successMessage').style.display = 'block';
                } else {
                    throw new Error('Erreur lors de l\'envoi');
                }
            })
            .catch(error => {
                console.error('Erreur:', error);
                document.getElementById('errorMessage').style.display = 'block';
            });
        });
    </script>
</body>
</html>
