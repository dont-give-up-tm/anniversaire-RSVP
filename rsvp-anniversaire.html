<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSVP - Anniversaire Alexia & Tristan</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
            padding: 40px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .emoji {
            font-size: 50px;
            margin-bottom: 15px;
        }

        .header h1 {
            font-size: 28px;
            color: #333;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 16px;
            color: #666;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
            font-size: 16px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .radio-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .radio-option {
            display: flex;
            align-items: center;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .radio-option:hover {
            border-color: #667eea;
            background-color: #f8f9ff;
        }

        .radio-option input[type="radio"] {
            margin-right: 12px;
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: #667eea;
        }

        .radio-option label {
            margin: 0;
            font-weight: 500;
            cursor: pointer;
            flex: 1;
        }

        .form-group.hidden {
            display: none;
        }

        .form-group.hidden-fade {
            opacity: 0;
            pointer-events: none;
            max-height: 0;
            overflow: hidden;
            transition: opacity 0.3s ease, max-height 0.3s ease;
        }

        .form-group.visible-fade {
            opacity: 1;
            pointer-events: auto;
            max-height: 500px;
            transition: opacity 0.3s ease, max-height 0.3s ease;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }

        .submit-btn:hover {
            opacity: 0.9;
        }

        .submit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .success-message {
            display: none;
            text-align: center;
            padding: 20px;
            background-color: #e8f5e9;
            border-radius: 10px;
            color: #2e7d32;
            margin-top: 20px;
        }

        .error-message {
            display: none;
            text-align: center;
            padding: 20px;
            background-color: #ffebee;
            border-radius: 10px;
            color: #c62828;
            margin-top: 20px;
        }

        .question-number {
            font-size: 12px;
            color: #999;
            margin-bottom: 5px;
            font-weight: 600;
        }

        @media (max-width: 600px) {
            .container {
                padding: 30px 20px;
            }

            .header h1 {
                font-size: 24px;
            }

            .emoji {
                font-size: 40px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <img src="AandT_40years.png" alt="Anniversaire 40 ans Alexia & Tristan" style="width: 100%; max-width: 400px; border-radius: 15px; margin-bottom: 20px;">
            <p style="margin-top: 15px; font-size: 16px; color: #666;">Samedi 15 septembre à partir de 20h</p>
        </div>

        <form id="rsvpForm" action="/.netlify/functions/rsvp" method="POST">
            <div class="form-group">
                <label for="prenomInput">Ton prénom</label>
                <input 
                    type="text" 
                    id="prenomInput" 
                    name="prénom" 
                    placeholder="Jean" 
                    required
                    readonly
                    style="background-color: #f5f5f5;"
                >
            </div>

            <!-- QUESTION 1 : Tu viens ? -->
            <div class="form-group">
                <label>Tu viens ? *</label>
                <div class="radio-group">
                    <div class="radio-option">
                        <input 
                            type="radio" 
                            id="oui" 
                            name="réponse" 
                            value="Oui, je viens !" 
                            required
                        >
                        <label for="oui">Oui, je viens ! 🎉</label>
                    </div>

                    <div class="radio-option">
                        <input 
                            type="radio" 
                            id="peutetre" 
                            name="réponse" 
                            value="Peut-être, je te dis bientôt"
                        >
                        <label for="peutetre">Peut-être, je te dis bientôt 🤔</label>
                    </div>

                    <div class="radio-option">
                        <input 
                            type="radio" 
                            id="non" 
                            name="réponse" 
                            value="Non, pas possible cette fois"
                        >
                        <label for="non">Non, pas possible cette fois 😞</label>
                    </div>
                </div>
            </div>

            <!-- QUESTION 2 : Avec qui ? (Apparaît seulement si "Oui") -->
            <div class="form-group hidden-fade" id="questionAvecQui">
                <label>Avec qui viens-tu ? *</label>
                <div class="radio-group">
                    <div class="radio-option">
                        <input 
                            type="radio" 
                            id="seul" 
                            name="avec_qui" 
                            value="Seul(e)"
                        >
                        <label for="seul">Seul(e) 👤</label>
                    </div>

                    <div class="radio-option">
                        <input 
                            type="radio" 
                            id="deux" 
                            name="avec_qui" 
                            value="À deux"
                        >
                        <label for="deux">À deux 👥</label>
                    </div>

                    <div class="radio-option">
                        <input 
                            type="radio" 
                            id="enfants" 
                            name="avec_qui" 
                            value="Avec les enfants"
                        >
                        <label for="enfants">Avec les enfants 👨‍👩‍👧‍👦</label>
                    </div>
                </div>
            </div>

            <input type="hidden" name="timestamp" id="timestamp">
            <input type="hidden" name="user_link" id="userLink">

            <button type="submit" class="submit-btn">Confirmer ma réponse</button>
        </form>

        <div class="success-message" id="successMessage">
            ✅ Merci ! Ta réponse a bien été enregistrée.
        </div>
        <div class="error-message" id="errorMessage">
            ❌ Erreur lors de l'envoi. Réessaie stp.
        </div>
    </div>

    <script>
        // Récupère le prénom de l'URL
        const params = new URLSearchParams(window.location.search);
        const prenom = params.get('name');

        if (prenom) {
            document.getElementById('prenomInput').value = prenom;
        } else {
            document.getElementById('prenomInput').removeAttribute('readonly');
            document.getElementById('prenomInput').style.backgroundColor = 'white';
        }

        // Gère l'affichage conditionnel de la question 2
        const radioButtons = document.querySelectorAll('input[name="réponse"]');
        const questionAvecQui = document.getElementById('questionAvecQui');

        radioButtons.forEach(radio => {
            radio.addEventListener('change', function() {
                if (this.value === 'Oui, je viens !') {
                    // Affiche la question 2
                    questionAvecQui.classList.remove('hidden-fade');
                    questionAvecQui.classList.add('visible-fade');
                    
                    // Rend le champ "avec_qui" requis
                    const avecQuiInputs = document.querySelectorAll('input[name="avec_qui"]');
                    avecQuiInputs.forEach(input => {
                        input.required = true;
                    });
                } else {
                    // Cache la question 2
                    questionAvecQui.classList.remove('visible-fade');
                    questionAvecQui.classList.add('hidden-fade');
                    
                    // Désélectionne et rend optionnel le champ "avec_qui"
                    const avecQuiInputs = document.querySelectorAll('input[name="avec_qui"]');
                    avecQuiInputs.forEach(input => {
                        input.checked = false;
                        input.required = false;
                    });
                }
            });
        });

        // Remplissage des champs cachés
        document.getElementById('timestamp').value = new Date().toISOString();
        document.getElementById('userLink').value = window.location.href;

        // Gestion de l'envoi du formulaire
        document.getElementById('rsvpForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const prenom = document.getElementById('prenomInput').value;
            const reponse = document.querySelector('input[name="réponse"]:checked')?.value || '';
            const avecQui = document.querySelector('input[name="avec_qui"]:checked')?.value || '';

            if (!prenom || !reponse) {
                document.getElementById('errorMessage').textContent = 'Veuillez remplir tous les champs obligatoires.';
                document.getElementById('errorMessage').style.display = 'block';
                return;
            }

            // Si "Oui", vérifie que "avec_qui" est rempli
            if (reponse === 'Oui, je viens !' && !avecQui) {
                document.getElementById('errorMessage').textContent = 'Veuillez indiquer avec qui vous venez.';
                document.getElementById('errorMessage').style.display = 'block';
                return;
            }

            const formData = new FormData(this);

            fetch('/.netlify/functions/rsvp', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: new URLSearchParams({
                    'prénom': prenom,
                    'réponse': reponse,
                    'avec_qui': avecQui || 'N/A',
                    'timestamp': new Date().toISOString(),
                    'user_link': window.location.href
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.result === 'success') {
                    document.getElementById('rsvpForm').style.display = 'none';
                    document.getElementById('successMessage').style.display = 'block';
                } else {
                    throw new Error(data.message);
                }
            })
            .catch(error => {
                console.error('Erreur:', error);
                document.getElementById('errorMessage').textContent = 'Erreur: ' + error.message;
                document.getElementById('errorMessage').style.display = 'block';
            });
        });
    </script>
</body>
</html>
