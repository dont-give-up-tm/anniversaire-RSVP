<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSVP - Anniversaire Alexia & Tristan</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: linear-gradient(135deg, #16859D 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
            padding: 40px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header img {
            width: 100%;
            max-width: 400px;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        .header p {
            font-size: 16px;
            color: #666;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
            font-size: 16px;
        }

        .radio-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .radio-option {
            display: flex;
            align-items: center;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .radio-option:hover {
            border-color: #272C6E;
            background-color: #f8f9ff;
        }

        .radio-option input[type="radio"] {
            margin-right: 12px;
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: #16859D;
        }

        .radio-option label {
            margin: 0;
            font-weight: 500;
            cursor: pointer;
            flex: 1;
        }

        .form-group.hidden-fade {
            opacity: 0;
            pointer-events: none;
            max-height: 0;
            overflow: hidden;
            transition: opacity 0.3s ease, max-height 0.3s ease;
        }

        .form-group.visible-fade {
            opacity: 1;
            pointer-events: auto;
            max-height: 500px;
            transition: opacity 0.3s ease, max-height 0.3s ease;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #272C6E 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }

        .submit-btn:hover {
            opacity: 0.9;
        }

        .success-message {
            display: none;
            text-align: center;
            padding: 20px;
            background-color: #e8f5e9;
            border-radius: 10px;
            color: #2e7d32;
            margin-top: 20px;
        }

        .error-message {
            display: none;
            text-align: center;
            padding: 20px;
            background-color: #ffebee;
            border-radius: 10px;
            color: #c62828;
            margin-top: 20px;
        }

        #greetingMessage {
            font-weight: bold;
            color: #333;
            margin-bottom: 25px;
            font-size: 24px;
        }

        #prenomDisplay {
            font-weight: bold;
            color: #16859D;
        }

        @media (max-width: 600px) {
            .container {
                padding: 30px 20px;
            }

            #greetingMessage {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <img src="AandT_40years.png" alt="Anniversaire 40 ans Alexia & Tristan">
        </div>

        <form id="rsvpForm">
            <div class="form-group">
                <h2 id="greetingMessage">
                    Hello <span id="prenomDisplay"></span>
                </h2>
            </div>

            <input type="hidden" id="prenomInput" name="prénom">

            <div class="form-group">
                <label>Tu viens ? *</label>
                <div class="radio-group">
                    <div class="radio-option">
                        <input 
                            type="radio" 
                            id="oui" 
                            name="réponse" 
                            value="Oui, je viens !" 
                            required
                        >
                        <label for="oui">Oui, je viens ! 🎉</label>
                    </div>

                    <div class="radio-option">
                        <input 
                            type="radio" 
                            id="peutetre" 
                            name="réponse" 
                            value="Peut-être, je te dis bientôt"
                        >
                        <label for="peutetre">Peut-être, je te dis bientôt 🤔</label>
                    </div>

                    <div class="radio-option">
                        <input 
                            type="radio" 
                            id="non" 
                            name="réponse" 
                            value="Non, pas possible cette fois"
                        >
                        <label for="non">Non, pas possible cette fois 😞</label>
                    </div>
                </div>
            </div>

            <div class="form-group hidden-fade" id="questionAvecQui">
                <label>Avec qui viens-tu ? *</label>
                <div class="radio-group">
                    <div class="radio-option">
                        <input 
                            type="radio" 
                            id="seul" 
                            name="avec_qui" 
                            value="Seul(e)"
                        >
                        <label for="seul">Seul(e) 👤</label>
                    </div>

                    <div class="radio-option">
                        <input 
                            type="radio" 
                            id="deux" 
                            name="avec_qui" 
                            value="À deux"
                        >
                        <label for="deux">À deux 👥</label>
                    </div>

                    <div class="radio-option">
                        <input 
                            type="radio" 
                            id="enfants" 
                            name="avec_qui" 
                            value="Avec les enfants"
                        >
                        <label for="enfants">Avec les enfants 👨‍👩‍👧‍👦</label>
                    </div>
                </div>
            </div>

            <input type="hidden" name="timestamp" id="timestamp">
            <input type="hidden" name="user_link" id="userLink">
            <input type="hidden" name="id" id="userId">

            <button type="submit" class="submit-btn">Confirmer ma réponse</button>
        </form>

        <div class="success-message" id="successMessage">
            ✅ Merci ! Ta réponse a bien été enregistrée.
        </div>
        <div class="error-message" id="errorMessage">
            ❌ Erreur lors de l'envoi. Réessaie stp.
        </div>

        <div id="alreadyRespondedMessage" style="display: none; text-align: center; padding: 40px;">
            <div style="font-size: 60px; margin-bottom: 20px;">✅</div>
            <h2 style="color: #2e7d32; margin-bottom: 10px; font-size: 28px;">Tu as déjà répondu !</h2>
            <p style="color: #666; font-size: 16px; line-height: 1.6;">
                Merci pour ta confirmation.<br>
                On a hâte de te voir le 15 septembre ! 🎉
            </p>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const prenom = params.get('name');
        const userId = params.get('id');

        if (prenom) {
            document.getElementById('prenomInput').value = prenom;
            document.getElementById('prenomDisplay').textContent = prenom;
        } else {
            document.getElementById('prenomDisplay').textContent = '[Prénom manquant]';
        }

        document.getElementById('userId').value = userId || 'unknown';

        if (userId) {
            fetch('https://script.google.com/macros/s/AKfycbwpjtY26k3sYLjN9lDQFQzE8hKKLB1rF-OTIyVFBzWrMivxyqV3-9DUqNFOVpFgdzg/exec' + userId)
                .then(response => response.json())
                .then(data => {
                    if (data.alreadyResponded) {
                        document.getElementById('rsvpForm').style.display = 'none';
                        document.getElementById('alreadyRespondedMessage').style.display = 'block';
                    }
                })
                .catch(error => console.log('Vérification:', error));
        }

        const radioButtons = document.querySelectorAll('input[name="réponse"]');
        const questionAvecQui = document.getElementById('questionAvecQui');

        radioButtons.forEach(radio => {
            radio.addEventListener('change', function() {
                if (this.value === 'Oui, je viens !') {
                    questionAvecQui.classList.remove('hidden-fade');
                    questionAvecQui.classList.add('visible-fade');
                    
                    const avecQuiInputs = document.querySelectorAll('input[name="avec_qui"]');
                    avecQuiInputs.forEach(input => {
                        input.required = true;
                    });
                } else {
                    questionAvecQui.classList.remove('visible-fade');
                    questionAvecQui.classList.add('hidden-fade');
                    
                    const avecQuiInputs = document.querySelectorAll('input[name="avec_qui"]');
                    avecQuiInputs.forEach(input => {
                        input.checked = false;
                        input.required = false;
                    });
                }
            });
        });

        document.getElementById('timestamp').value = new Date().toISOString();
        document.getElementById('userLink').value = window.location.href;

        document.getElementById('rsvpForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const prenomValue = document.getElementById('prenomInput').value;
            const reponse = document.querySelector('input[name="réponse"]:checked')?.value || '';
            const avecQui = document.querySelector('input[name="avec_qui"]:checked')?.value || '';

            if (!prenomValue || !reponse) {
                document.getElementById('errorMessage').textContent = 'Veuillez remplir tous les champs obligatoires.';
                document.getElementById('errorMessage').style.display = 'block';
                return;
            }

            if (reponse === 'Oui, je viens !' && !avecQui) {
                document.getElementById('errorMessage').textContent = 'Veuillez indiquer avec qui vous venez.';
                document.getElementById('errorMessage').style.display = 'block';
                return;
            }

            fetch('/api/rsvp', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: new URLSearchParams({
                    'prénom': prenomValue,
                    'réponse': reponse,
                    'avec_qui': avecQui || 'N/A',
                    'timestamp': new Date().toISOString(),
                    'id': userId || 'unknown'
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.result === 'success') {
                    document.getElementById('rsvpForm').style.display = 'none';
                    document.getElementById('successMessage').style.display = 'block';
                } else {
                    throw new Error(data.message);
                }
            })
            .catch(error => {
                console.error('Erreur:', error);
                document.getElementById('errorMessage').textContent = 'Erreur: ' + error.message;
                document.getElementById('errorMessage').style.display = 'block';
            });
        });
    </script>
</body>
</html>
